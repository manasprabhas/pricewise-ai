<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#1C2B4B">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; font-src data:; img-src data:; connect-src 'none'">
<title>PriceWise Pocket</title>
<style>
@font-face { font-family: 'BSD'; src: url(data:font/ttf;base64,__FONT_DISPLAY__) format('truetype'); font-weight: 100 900; }
@font-face { font-family: 'AH'; src: url(data:font/ttf;base64,__FONT_BODY__) format('truetype'); font-weight: 400; }
@font-face { font-family: 'AH'; src: url(data:font/ttf;base64,__FONT_BODY_BOLD__) format('truetype'); font-weight: 700; }
:root { --ink:#1C2B4B; --soft:#4A5876; --tag:#FFD43B; --red:#E0382F; --green:#2D7D52; --paper:#FCFCF8; --freezer:#DDE7E4;
  --display:'BSD','Arial Narrow',Impact,sans-serif; --body:'AH','Segoe UI',system-ui,sans-serif; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body { font-family: var(--body); color: var(--ink); background: var(--freezer); font-size: 16px;
  padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
button { font-family: inherit; color: inherit; cursor: pointer; }
.top { position: sticky; top: 0; z-index: 5; background: var(--ink); color: #fff; padding: 10px 14px 10px;
  padding-top: calc(10px + env(safe-area-inset-top)); display: flex; align-items: center; gap: 10px; }
.logo { background: var(--tag); color: var(--ink); font-family: var(--display); font-weight: 900; font-size: 1.35rem;
  padding: 0 8px; line-height: 1.35; letter-spacing: .01em; }
.logo small { font-size: .8rem; font-weight: 800; letter-spacing: .08em; }
.store { margin-left: auto; background: transparent; color: #fff; border: 2px solid rgba(255,255,255,.5);
  font: 700 .95rem var(--body); padding: 6px 8px; border-radius: 0; max-width: 46vw; }
.store option { color: var(--ink); }
.status { background: #142039; color: #c9d3e6; font-size: .78rem; padding: 5px 14px; display: flex; gap: 8px;
  align-items: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; flex: none; }
.wrap { padding: 14px; max-width: 560px; margin: 0 auto; }
h2 { font-family: var(--display); font-weight: 900; font-size: 2rem; margin: 4px 0 8px; line-height: 1; }
.search { width: 100%; font: 700 1.15rem var(--body); padding: 14px; border: 3px solid var(--ink); background: #fff;
  box-shadow: 4px 4px 0 var(--ink); border-radius: 0; outline: none; color: var(--ink); }
.search:focus { box-shadow: 4px 4px 0 var(--tag), 4px 4px 0 2px var(--ink); }
.list { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
.row { background: #fff; border: 2px solid var(--ink); padding: 10px 12px; display: grid; grid-template-columns: 1fr auto;
  gap: 2px 10px; align-items: center; text-align: left; width: 100%; font-size: 1rem; }
.row .t { font-weight: 700; }
.row .d { color: var(--soft); font-size: .85rem; }
.row .p { font-family: var(--display); font-weight: 900; font-size: 1.5rem; grid-row: 1 / span 2; grid-column: 2; }
.pill { display: inline-block; font-size: .72rem; font-weight: 700; padding: 1px 6px; border: 1.5px solid currentColor;
  margin-left: 4px; vertical-align: 1px; text-transform: uppercase; letter-spacing: .04em; }
.pill.stale { color: var(--red); } .pill.old { color: #9a6b00; } .pill.none { color: var(--soft); }
.pill.mine { color: var(--green); }
.sec { font-family: var(--display); font-weight: 800; font-size: 1.15rem; margin: 18px 0 6px; letter-spacing: .02em; }
.muted { color: var(--soft); font-size: .88rem; }
.empty { border: 2px dashed var(--soft); padding: 16px; color: var(--soft); text-align: center; background: rgba(255,255,255,.4); }
/* product view */
.back { background: none; border: none; font: 700 1rem var(--body); padding: 4px 0; color: var(--soft); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
.chip { border: 2px solid var(--ink); background: #fff; padding: 6px 10px; font: 700 .9rem var(--body); }
.chip.on { background: var(--ink); color: #fff; }
.tag { background: var(--tag); border: 3px solid var(--ink); box-shadow: 5px 5px 0 var(--ink); padding: 10px 14px 8px;
  margin: 10px 0 14px; position: relative; }
.tag::before { content: ""; position: absolute; top: 12px; left: 10px; width: 10px; height: 10px; border: 2px solid var(--ink);
  border-radius: 50%; background: var(--freezer); }
.basis { font-weight: 700; font-size: .92rem; padding-left: 18px; }
.price { font-family: var(--display); font-weight: 900; font-size: 4rem; line-height: .95; display: flex; align-items: flex-start;
  gap: 2px; margin: 4px 0 2px; }
.price .s { font-size: 2rem; margin-top: 8px; } .price .c { font-size: 2.3rem; margin-top: 6px; text-decoration: underline; }
.price.blank { color: rgba(28,43,75,.35); }
.unitp { font-size: .9rem; font-weight: 700; }
.verdict { padding: 10px 12px; border: 2px solid var(--ink); background: #fff; font-weight: 700; margin-bottom: 10px; }
.verdict.good { background: var(--green); color: #fff; } .verdict.bad { background: var(--red); color: #fff; }
.verdict small { display: block; font-weight: 400; opacity: .9; margin-top: 2px; }
.cmp { background: #fff; border: 2px solid var(--ink); }
.cmp div { display: grid; grid-template-columns: 1fr auto; padding: 7px 10px; border-top: 1px solid rgba(28,43,75,.12); gap: 8px; }
.cmp div:first-child { border-top: none; }
.cmp b { font-family: var(--display); font-size: 1.25rem; }
.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.pad button { font: 900 2rem var(--display); padding: 12px 0; background: #fff; border: 2px solid var(--ink);
  box-shadow: 3px 3px 0 var(--ink); touch-action: manipulation; }
.pad button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.save { width: 100%; margin-top: 12px; font: 900 1.6rem var(--display); background: var(--ink); color: var(--tag);
  border: 3px solid var(--ink); padding: 14px; box-shadow: 4px 4px 0 var(--tag); letter-spacing: .02em; }
.save:disabled { opacity: .35; }
.terms { width: 100%; font: 1rem var(--body); padding: 10px; border: 2px solid var(--ink); margin-top: 6px; border-radius: 0; }
details summary { font-weight: 700; margin-top: 10px; cursor: pointer; }
.stepper { display: inline-flex; border: 2px solid var(--ink); background: #fff; margin-left: 6px; vertical-align: middle; }
.stepper button { border: none; background: none; font: 900 1.2rem var(--display); width: 34px; }
.stepper span { padding: 2px 8px; font-weight: 700; }
/* shop */
.budget { background: var(--ink); color: #fff; padding: 12px 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.budget .k { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: #c9d3e6; }
.budget .v { font-family: var(--display); font-weight: 900; font-size: 2rem; line-height: 1; }
.budget .v.over { color: #ff8f88; }
.bar { grid-column: 1 / -1; height: 12px; background: #142039; border: 1px solid #c9d3e6; position: relative; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--tag); }
.bar i.over { background: var(--red); }
.item { background: #fff; border: 2px solid var(--ink); display: grid; grid-template-columns: 44px 1fr auto; align-items: center; }
.item.done { background: #eef4f1; }
.item.done .t { text-decoration: line-through; opacity: .6; }
.check { width: 44px; height: 100%; min-height: 54px; border: none; border-right: 2px solid var(--ink); background: none;
  font: 900 1.5rem var(--display); }
.item.done .check { background: var(--green); color: #fff; }
.item .body { padding: 8px 10px; }
.item .t { font-weight: 700; }
.item .d { font-size: .82rem; color: var(--soft); }
.item .amt { padding: 0 10px; text-align: right; }
.item .amt b { font-family: var(--display); font-size: 1.45rem; display: block; }
.item .amt button { border: none; background: none; font-size: 1.3rem; padding: 2px 4px; color: var(--soft); }
.menu { grid-column: 1 / -1; border-top: 2px dashed rgba(28,43,75,.3); padding: 8px; display: flex; gap: 6px; flex-wrap: wrap; background: var(--paper); }
.menu button { border: 2px solid var(--ink); background: #fff; padding: 6px 10px; font-weight: 700; }
.menu .subs { width: 100%; display: flex; flex-direction: column; gap: 4px; }
.btn { border: 2px solid var(--ink); background: #fff; padding: 10px 14px; font-weight: 700; box-shadow: 3px 3px 0 var(--ink); }
.btn.primary { background: var(--tag); }
.btn.danger { color: var(--red); }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--ink); display: grid; grid-template-columns: repeat(3, 1fr);
  padding-bottom: env(safe-area-inset-bottom); z-index: 6; }
.tabs button { background: none; border: none; color: #c9d3e6; padding: 10px 0 12px; font: 800 1.15rem var(--display);
  letter-spacing: .03em; }
.tabs button.on { color: var(--ink); background: var(--tag); }
.tabs button i { display: block; font-style: normal; font-size: 1.3rem; line-height: 1.1; }
.toast { position: fixed; left: 50%; top: calc(64px + env(safe-area-inset-top)); transform: translateX(-50%); background: var(--ink); color: #fff;
  padding: 10px 16px; font-weight: 700; border: 2px solid var(--tag); z-index: 9; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.on { opacity: 1; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; background: #fff; border: 2px solid var(--ink); padding: 10px 12px; }
.kv b { font-family: var(--display); font-size: 1.4rem; }
input.device { font: 700 1rem var(--body); padding: 8px; border: 2px solid var(--ink); width: 100%; border-radius: 0; }
.hide { display: none !important; }
body.entry .tabs, body.entry .status { display: none; }
.mini { margin-top: 6px; display: inline-block; font-weight: 700; font-size: .9rem; padding: 3px 8px; background: #fff; border: 2px solid var(--ink); }
.mini.good { background: var(--green); color: #fff; } .mini.bad { background: var(--red); color: #fff; }
body.entry h2 { font-size: 1.7rem; }
body.entry .tag { margin: 6px 0 12px; padding-top: 6px; }
body.entry { padding-bottom: calc(318px + env(safe-area-inset-bottom)); }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 7; background: var(--ink); padding: 10px 12px;
  padding-bottom: calc(10px + env(safe-area-inset-bottom)); box-shadow: 0 -4px 0 var(--tag); }
.sheet .pad { margin-top: 0; gap: 6px; max-width: 540px; margin: 0 auto; }
.sheet .pad button { padding: 7px 0; font-size: 1.75rem; box-shadow: 2px 2px 0 var(--tag); border-color: #fff; }
.sheet .save { margin: 8px auto 0; display: block; max-width: 540px; background: var(--tag); color: var(--ink);
  border-color: var(--tag); box-shadow: none; padding: 11px; font-size: 1.45rem; }
</style>
</head>
<body>
<div class="top"><div class="logo">PriceWise <small>POCKET</small></div>
  <select class="store" id="store" aria-label="Store you're in"></select></div>
<div class="status"><span class="dot"></span><span id="status">Works offline</span></div>

<main class="wrap" id="view-check">
  <div id="check-search">
    <input class="search" id="q" type="search" placeholder="Search: milk, eggs, cereal…" autocomplete="off" aria-label="Search products">
    <div class="list" id="results"></div>
    <div class="sec" id="recent-h">Noted on this phone</div>
    <div class="list" id="recent"></div>
  </div>
  <div id="check-product" class="hide"></div>
</main>

<main class="wrap hide" id="view-shop"></main>
<main class="wrap hide" id="view-sync"></main>

<nav class="tabs" id="tabs">
  <button data-v="check" class="on"><i>⌕</i>Check price</button>
  <button data-v="shop"><i>☑</i>Shop</button>
  <button data-v="sync"><i>⇅</i>Sync</button>
</nav>
<div class="toast" id="toast"></div>

<script id="pocket-data" type="application/json">__POCKET_DATA__</script>
<script>
"use strict";
const B = JSON.parse(document.getElementById("pocket-data").textContent);
const P = B.products;
const KEY = "pricewise-pocket";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const money = (c) => (c < 0 ? "−" : "") + "$" + (Math.abs(c) / 100).toFixed(2);
const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const SRC = {receipt: "paid", ad: "weekly ad", shelf: "shelf tag", kroger: "store price list"};
const days = (iso) => Math.round((new Date(today()) - new Date(iso)) / 864e5);
const fmtDate = (iso) => new Date(iso + "T12:00:00").toLocaleDateString(undefined, {month: "short", day: "numeric", year: days(iso) > 300 ? "numeric" : undefined});
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : ([1e7] + -1e3 + -4e3 + -8e3 + -1e11).replace(/[018]/g, (c) =>
  (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)));

// ---------- state (kept on this phone only) ----------
let memory = null;
function load() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { s = memory; }
  if (!s || s.bundle !== B.export_id) {
    const old = s || {};
    s = {bundle: B.export_id, device: old.device || "my phone", store: old.store || B.stores[0] || "",
         observations: old.observations || [], list_changes: [], exported: old.exported || [],
         budget: B.budget_cents, items: B.list.items.map((i) => ({product_id: i.product_id, qty: i.qty, checked: false}))};
  }
  return s;
}
let S = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { memory = S; } }
function change(action, extra) { S.list_changes.push(Object.assign({at: new Date().toISOString(), action: action}, extra)); save(); }

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 2200); }

// ---------- prices ----------
function age(iso) {
  const d = days(iso);
  if (d > B.stale_days) return `<span class="pill stale">stale · ${d} d</span>`;
  if (d > 30) return `<span class="pill old">${d} d old</span>`;
  return `<span class="pill">${d === 0 ? "today" : d + " d ago"}</span>`;
}
function mine(pid, store) {   // the newest price noted on this phone
  const o = S.observations.filter((o) => o.product_id === pid && (!store || o.store === store));
  return o.length ? o[o.length - 1] : null;
}
function perUnit(p, cents) {  // cents per display unit
  if (p.weighed) return null;
  return cents / p.base_qty * p.unit_factor;
}
function unitText(p, cents) {
  const u = perUnit(p, cents);
  if (u === null) return "";
  const lbl = p.display_unit === "each" ? "ea" : p.display_unit;
  return u < 10 ? (u).toFixed(1) + "¢/" + lbl : "$" + (u / 100).toFixed(2) + "/" + lbl;
}
function expected(pid, store) {  // what one unit (package or lb) is expected to cost here
  const m = mine(pid, store);
  if (m) return {cents: m.price_cents, how: "noted today", est: false};
  const h = P[pid].stores[store];
  if (h && days(h.last_date) <= B.stale_days) return {cents: h.usual ?? h.last, how: "usual here", est: false};
  let best = null;
  for (const [st, x] of Object.entries(P[pid].stores)) {
    if (days(x.last_date) > B.stale_days) continue;
    const c = x.usual ?? x.last;
    if (!best || c < best.cents) best = {cents: c, how: "est. from " + st, est: true};
  }
  return best;
}

// ---------- search ----------
function norm(s) { return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }
function search(q) {
  const words = norm(q).split(/\s+/).filter(Boolean);
  if (!words.length) return [];
  return Object.values(P).map((p) => {
    const hay = norm(`${p.label} ${p.kind} ${p.category} ${p.variant}`);
    let score = 0;
    for (const w of words) {
      if (hay.includes(w)) score += hay.startsWith(w) || hay.includes(" " + w) ? 3 : 2;
      else if (w.length > 3 && hay.includes(w.slice(0, -1))) score += 1;
      else return null;
    }
    score += Object.keys(p.stores).length ? 1 : 0;
    return {p, score};
  }).filter(Boolean).sort((a, b) => b.score - a.score || a.p.label.localeCompare(b.p.label)).slice(0, 25).map((x) => x.p);
}
let timer = null;   // when the shopper started looking something up
function startTimer() { if (timer === null) timer = performance.now(); }
function rowHTML(p) {
  const st = S.store, h = p.stores[st], m = mine(p.id, st);
  let d, price = "";
  if (m) { d = `you noted ${money(m.price_cents)} ${fmtDate(m.date)} <span class="pill mine">this phone</span>`; price = money(m.price_cents); }
  else if (h) { d = `${h.last_source === "receipt" ? "last paid" : "seen (" + SRC[h.last_source] + ")"} here ${fmtDate(h.last_date)} ${age(h.last_date)}`; price = money(h.last); }
  else if (Object.keys(p.stores).length) { d = `not seen at ${esc(st)} <span class="pill none">other stores only</span>`; }
  else { d = `<span class="pill none">no history</span> tap to record the shelf price`; }
  return `<button class="row" data-pid="${p.id}"><span class="t">${esc(p.label)}</span><span class="p">${price}</span><span class="d">${d}</span></button>`;
}
function renderSearch() {
  const q = $("#q").value.trim();
  const res = search(q);
  $("#results").innerHTML = q ? (res.length ? res.map(rowHTML).join("") :
    `<div class="empty">Nothing called “${esc(q)}”. Products come from your laptop; add it there and make a new Pocket file.</div>`) : "";
  const rec = S.observations.slice(-8).reverse();
  $("#recent-h").classList.toggle("hide", !rec.length || !!q);
  $("#recent").innerHTML = q ? "" : rec.map((o) => `<div class="row"><span class="t">${esc(P[o.product_id].label)}</span>
    <span class="p">${money(o.price_cents)}</span><span class="d">${esc(o.store)} · ${fmtDate(o.date)} · ${o.seconds}s${S.exported.includes(o.uuid) ? " · exported" : ""}</span></div>`).join("");
}
$("#q").addEventListener("focus", startTimer);
$("#q").addEventListener("input", () => { startTimer(); renderSearch(); });
$("#results").addEventListener("click", (e) => { const b = e.target.closest("[data-pid]"); if (b) openProduct(+b.dataset.pid); });

// ---------- product + keypad ----------
let cur = null;   // {pid, digits, multibuy, from}
function family(p) {  // other packages of the same food from the same brand, to switch size or variant quickly
  return Object.values(P).filter((x) => x.kind === p.kind && x.brand === p.brand && x.id !== p.id);
}
function openProduct(pid, from) {
  startTimer();
  cur = {pid, digits: "", multibuy: 1, from: from || "check", terms: ""};
  document.body.classList.add("entry");
  show("check");
  $("#check-search").classList.add("hide");
  $("#check-product").classList.remove("hide");
  renderProduct();
  window.scrollTo(0, 0);
}
function enteredCents() { return cur.digits ? parseInt(cur.digits, 10) : 0; }
function perUnitCents() { return Math.round(enteredCents() / cur.multibuy); }
function quick(p) {   // one-line verdict that stays visible above the keypad
  const st = S.store, h = p.stores[st], c = perUnitCents();
  if (!Object.keys(p.stores).length) return {cls: "", text: "No history yet: saving records it"};
  if (!c) return {cls: "", text: h ? `Usual here ${money(h.usual ?? h.last)}` : "Not bought here before"};
  const fresh = Object.entries(p.stores).filter(([s, x]) => days(x.last_date) <= B.stale_days);
  const here = h && days(h.last_date) <= B.stale_days ? (h.usual ?? h.last) : null;
  const ref = here ?? (fresh.length ? Math.min(...fresh.map(([s, x]) => x.usual ?? x.last)) : null);
  if (ref === null) return {cls: "", text: "Only stale prices to compare"};
  const d = (c - ref) / ref;
  return {cls: d <= -0.05 ? "good" : d >= 0.05 ? "bad" : "",
          text: `${Math.abs(Math.round(d * 100))}% ${d < 0 ? "below" : "above"} ${here !== null ? "usual here" : "best elsewhere"} (${money(ref)})`};
}
function verdictHTML(p) {
  const st = S.store, h = p.stores[st], c = perUnitCents();
  const others = Object.entries(p.stores).filter(([s, x]) => s !== st && days(x.last_date) <= B.stale_days)
    .sort((a, b) => (a[1].usual ?? a[1].last) - (b[1].usual ?? b[1].last));
  const any = Object.keys(p.stores).length;
  let v = "";
  if (!any) v = `<div class="verdict">No history for this product yet.<small>Saving records this shelf price, so next time there's something to compare with.</small></div>`;
  else if (!c) v = `<div class="verdict">Type the shelf price.<small>It's compared with what you paid, with dates.</small></div>`;
  else {
    const ref = h && days(h.last_date) <= B.stale_days ? (h.usual ?? h.last) : (others[0] ? (others[0][1].usual ?? others[0][1].last) : null);
    const where = h && days(h.last_date) <= B.stale_days ? "your usual here" : others[0] ? `usual at ${others[0][0]}` : null;
    if (ref === null) v = `<div class="verdict">Only stale prices to compare with.<small>Saving records a fresh one.</small></div>`;
    else {
      const d = (c - ref) / ref;
      const cls = d <= -0.05 ? "good" : d >= 0.05 ? "bad" : "";
      const word = d <= -0.05 ? "Good price" : d >= 0.05 ? "Higher than usual" : "About usual";
      v = `<div class="verdict ${cls}">${word}: ${Math.abs(d * 100).toFixed(0)}% ${d < 0 ? "below" : "above"} ${esc(where)}<small>${money(c)} vs ${money(ref)}${others[0] && h ? ` · cheapest elsewhere: ${esc(others[0][0])} ${money(others[0][1].usual ?? others[0][1].last)}` : ""}</small></div>`;
    }
  }
  let rows = [];
  if (h) rows.push(`<div><span>${h.last_source === "receipt" ? "Last paid" : "Last seen (" + SRC[h.last_source] + ")"} at ${esc(st)}<br><span class="muted">${fmtDate(h.last_date)} ${age(h.last_date)}${h.last_source === "receipt" ? " · receipt" : " · never bought here"}</span></span><b>${money(h.last)}</b></div>`,
    ...(h.seen ? [`<div><span>Newer ${SRC[h.seen.source] || "price"} at ${esc(st)}<br><span class="muted">${fmtDate(h.seen.date)} ${age(h.seen.date)}${h.seen.note ? " · " + esc(h.seen.note) : ""}</span></span><b>${money(h.seen.cents)}</b></div>`] : []),
    `<div><span>Usual at ${esc(st)}<br><span class="muted">${h.n_recent ? `median of ${h.n_recent} in ${B.stale_days} days` : "none recent"}</span></span><b>${h.usual !== null ? money(h.usual) : "—"}</b></div>`);
  else if (any) rows.push(`<div><span>At ${esc(st)}</span><b class="muted">never seen</b></div>`);
  for (const [s, x] of others.slice(0, 3)) rows.push(`<div><span>${esc(s)}<br><span class="muted">last ${fmtDate(x.last_date)} ${age(x.last_date)}</span></span><b>${money(x.usual ?? x.last)}</b></div>`);
  const stale = Object.entries(p.stores).filter(([s, x]) => s !== st && days(x.last_date) > B.stale_days);
  for (const [s, x] of stale.slice(0, 2)) rows.push(`<div><span>${esc(s)}<br><span class="muted">${fmtDate(x.last_date)} ${age(x.last_date)}</span></span><b class="muted">${money(x.last)}</b></div>`);
  return v + (rows.length ? `<div class="cmp">${rows.join("")}</div>` : "");
}
function renderProduct() {
  const p = P[cur.pid], c = enteredCents();
  const basis = p.weighed ? "Price per lb" : cur.multibuy > 1 ? `${cur.multibuy} for… (total on the tag)` : `Price for one package${p.size ? " (" + esc(p.size) + ")" : ""}`;
  const dollars = Math.floor(c / 100), cents = String(c % 100).padStart(2, "0");
  const fam = family(p);
  $("#check-product").innerHTML = `
    <button class="back" id="back">‹ ${cur.from === "shop" ? "Back to the list" : "Search"}</button>
    <h2>${esc(p.brand ? p.brand + " " + p.name : p.name)}</h2>
    <div class="chips">${[p].concat(fam).slice(0, 6).map((x) => `<button class="chip ${x.id === p.id ? "on" : ""}" data-sw="${x.id}">${esc(x.weighed ? "by the lb" : x.size)}${x.variant ? " · " + esc(x.variant) : ""}</button>`).join("")}</div>
    <div class="tag">
      <div class="basis" id="basis">${basis}${p.weighed ? "" : ` <span class="stepper"><button id="mb-">−</button><span>${cur.multibuy === 1 ? "1 each" : cur.multibuy + " for"}</span><button id="mb+">+</button></span>`}</div>
      <div class="price ${c ? "" : "blank"}" id="price"><span class="s">$</span>${dollars}<span class="c">${cents}</span></div>
      <div class="unitp">${c ? (cur.multibuy > 1 ? `= ${money(perUnitCents())} each · ` : "") + (p.weighed ? "per lb" : unitText(p, perUnitCents())) : "&nbsp;"}</div>
      ${(() => { const q = quick(p); return `<div class="mini ${q.cls}">${esc(q.text)}</div>`; })()}
    </div>
    <div id="verdict">${verdictHTML(p)}</div>
    <details ${cur.terms ? "open" : ""}><summary>Offer terms (for a sale tag)</summary>
      <input class="terms" id="terms" placeholder="buy 2; store card; limit 4; ends Sat" value="${esc(cur.terms)}"></details>
    <div class="sheet"><div class="pad">${[1,2,3,4,5,6,7,8,9].map((n) => `<button data-k="${n}">${n}</button>`).join("")}
      <button data-k="C">C</button><button data-k="0">0</button><button data-k="B" aria-label="Delete">⌫</button></div>
    <button class="save" id="save" ${c ? "" : "disabled"}>Save ${c ? money(c) + (cur.multibuy > 1 ? " for " + cur.multibuy : "") : "price"} at ${esc(S.store)}</button></div>`;
}
$("#check-product").addEventListener("click", (e) => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.id === "back") return closeProduct();
  if (t.dataset.sw) { cur.pid = +t.dataset.sw; return renderProduct(); }
  if (t.id === "mb+") { cur.multibuy = Math.min(cur.multibuy + 1, 12); return renderProduct(); }
  if (t.id === "mb-") { cur.multibuy = Math.max(cur.multibuy - 1, 1); return renderProduct(); }
  if (t.dataset.k) {
    const k = t.dataset.k;
    if (k === "C") cur.digits = ""; else if (k === "B") cur.digits = cur.digits.slice(0, -1);
    else if (cur.digits.length < 6) cur.digits = (cur.digits + k).replace(/^0+/, "");
    return renderProduct();
  }
  if (t.id === "save") return saveObs();
});
$("#check-product").addEventListener("input", (e) => { if (e.target.id === "terms") cur.terms = e.target.value; });
function saveObs() {
  const p = P[cur.pid];
  const seconds = timer === null ? null : Math.round((performance.now() - timer) / 100) / 10;
  const o = {uuid: uuid(), product_id: p.id, store: S.store, date: today(), price_cents: perUnitCents(),
             basis: p.weighed ? "lb" : "package", multibuy: cur.multibuy, tag_cents: enteredCents(),
             terms: cur.terms.trim(), seconds, created_at: new Date().toISOString()};
  S.observations.push(o); save();
  timer = null;
  toast(`Saved ${money(o.price_cents)} · ${seconds ?? "?"}s`);
  const from = cur.from;
  closeProduct();
  if (from === "shop") show("shop");
}
function closeProduct() {
  const from = cur && cur.from;
  cur = null;
  document.body.classList.remove("entry");
  $("#check-product").classList.add("hide");
  $("#check-search").classList.remove("hide");
  $("#q").value = "";
  renderSearch();
  if (from === "shop") show("shop");
}

// ---------- shopping mode ----------
let openMenu = null;
function lineCents(it) {
  const e = expected(it.product_id, S.store);
  return e ? {cents: Math.round(e.cents * it.qty), e} : null;
}
function renderShop() {
  const items = S.items;
  let all = 0, done = 0, unknown = 0;
  for (const it of items) { const l = lineCents(it); if (!l) { unknown++; continue; } all += l.cents; if (it.checked) done += l.cents; }
  const left = S.budget - done, pct = Math.min(done / Math.max(S.budget, 1), 1) * 100;
  $("#view-shop").innerHTML = `
    <h2>${esc(B.list.name)}</h2>
    <div class="budget">
      <div><div class="k">In the cart</div><div class="v">${money(done)}</div></div>
      <div><div class="k">Budget left</div><div class="v ${left < 0 ? "over" : ""}" id="left">${money(left)}</div></div>
      <div class="bar"><i class="${left < 0 ? "over" : ""}" style="width:${pct}%"></i></div>
      <div class="k" style="grid-column:1/-1">Whole list ≈ ${money(all)} at ${esc(S.store)}${unknown ? ` · ${unknown} without a price` : ""} · budget $<input id="budget" type="number" inputmode="decimal" step="1" min="0" value="${(S.budget / 100).toFixed(0)}" aria-label="Budget in dollars" style="width:70px;background:#142039;border:1px solid #c9d3e6;color:#fff;font:700 .85rem var(--body);padding:1px 4px"></div>
    </div>
    <div class="list" id="items">${items.map((it, i) => {
      const p = P[it.product_id], l = lineCents(it);
      const q = p.weighed ? it.qty.toFixed(2) + " lb" : (it.qty === 1 ? "1" : it.qty + " ×");
      return `<div class="item ${it.checked ? "done" : ""}">
        <button class="check" data-i="${i}" aria-label="In the cart">${it.checked ? "✓" : ""}</button>
        <div class="body" data-open="${i}"><div class="t">${esc(p.label)}</div><div class="d">${q} · ${l ? esc(l.e.how) : "no price yet: tap ⋯ › Check price"}</div></div>
        <div class="amt"><b>${l ? money(l.cents) : "—"}</b><button data-m="${i}" aria-label="More">⋯</button></div>
        ${openMenu === i ? menuHTML(i) : ""}</div>`; }).join("") || `<div class="empty">The list is empty. Add something below.</div>`}</div>
    <div class="sec">Add to the list</div>
    <input class="search" id="addq" type="search" placeholder="Search to add…" autocomplete="off">
    <div class="list" id="addres"></div>`;
}
function menuHTML(i) {
  const it = S.items[i], p = P[it.product_id];
  const subs = Object.values(P).filter((x) => x.kind === p.kind && x.id !== p.id && x.variant === p.variant)
    .map((x) => ({x, e: expected(x.id, S.store)})).sort((a, b) => (a.e ? a.e.cents : 1e9) - (b.e ? b.e.cents : 1e9)).slice(0, 4);
  return `<div class="menu"><button data-price="${i}">Check price</button><button data-qty="${i}" data-d="1">+1</button>
    <button data-qty="${i}" data-d="-1">−1</button><button data-rm="${i}" class="danger" style="color:var(--red)">Remove</button>
    ${subs.length ? `<div class="subs"><span class="muted">Swap for (same ${esc(p.kind)}${p.variant ? ", " + esc(p.variant) : ""}):</span>${subs.map((s) => `<button data-sub="${i}" data-to="${s.x.id}" style="text-align:left">${esc(s.x.label)} · ${s.e ? money(s.e.cents) : "no price"}</button>`).join("")}</div>` : ""}</div>`;
}
$("#view-shop").addEventListener("click", (e) => {
  const t = e.target.closest("button, [data-open]"); if (!t) return;
  const d = t.dataset;
  if (d.i !== undefined) { const it = S.items[+d.i]; it.checked = !it.checked; change(it.checked ? "check" : "uncheck", {product_id: it.product_id}); }
  else if (d.m !== undefined || d.open !== undefined) { const i = +(d.m ?? d.open); openMenu = openMenu === i ? null : i; }
  else if (d.rm !== undefined) { const it = S.items.splice(+d.rm, 1)[0]; change("remove", {product_id: it.product_id}); openMenu = null; }
  else if (d.sub !== undefined) { const it = S.items[+d.sub]; change("substitute", {product_id: it.product_id, to_product_id: +d.to}); it.product_id = +d.to; openMenu = null; toast("Swapped"); }
  else if (d.qty !== undefined) { const it = S.items[+d.qty], p = P[it.product_id]; const step = p.weighed ? 0.25 : 1;
    it.qty = Math.max(step, Math.round((it.qty + step * +d.d) * 100) / 100); change("quantity", {product_id: it.product_id, qty: it.qty}); }
  else if (d.price !== undefined) { const it = S.items[+d.price]; openMenu = null; save(); return openProduct(it.product_id, "shop"); }
  else if (d.add !== undefined) { S.items.push({product_id: +d.add, qty: 1, checked: false}); change("add", {product_id: +d.add}); toast("Added"); }
  save(); renderShop();
});
$("#view-shop").addEventListener("change", (e) => {
  if (e.target.id !== "budget") return;
  const v = parseFloat(e.target.value);
  if (!isNaN(v) && v >= 0) { S.budget = Math.round(v * 100); change("budget", {cents: S.budget}); save(); renderShop(); }
});
$("#view-shop").addEventListener("input", (e) => {
  if (e.target.id !== "addq") return;
  const res = search(e.target.value).slice(0, 8);
  $("#addres").innerHTML = res.map((p) => `<button class="row" data-add="${p.id}"><span class="t">${esc(p.label)}</span><span class="d">${(() => { const x = expected(p.id, S.store); return x ? money(x.cents) + " · " + esc(x.how) : "no price"; })()}</span></button>`).join("");
});

// ---------- sync ----------
function exportName() { const d = new Date(); return `pricewise-pocket-${today()}-${String(d.getHours()).padStart(2, "0")}${String(d.getMinutes()).padStart(2, "0")}.json`; }
function exportData() {
  return {format: "pricewise-pocket/1", export_id: uuid(), bundle_id: B.export_id, device: S.device,
          exported_at: new Date().toISOString(), list_name: B.list.name, observations: S.observations,
          list_changes: S.list_changes, final_list: S.items.map((i) => ({product_id: i.product_id, qty: i.qty})),
          budget_cents: S.budget};
}
function renderSync() {
  const pending = S.observations.filter((o) => !S.exported.includes(o.uuid)).length;
  const t = S.observations.map((o) => o.seconds).filter((x) => x !== null).sort((a, b) => a - b);
  const med = t.length ? t[Math.floor((t.length - 1) / 2)] : null;
  $("#view-sync").innerHTML = `
    <h2>Sync with your laptop</h2>
    <div class="kv"><span>Prices noted, not yet exported</span><b>${pending}</b>
      <span>All prices noted on this phone</span><b>${S.observations.length}</b>
      <span>Shopping list changes</span><b>${S.list_changes.length}</b>
      <span>Typical time to note a price</span><b>${med === null ? "—" : med + "s"}</b></div>
    <p class="muted">Export saves a small file. Move it to the laptop (cable, AirDrop, Nearby Share or email to yourself) and open
      PriceWise › Pocket › Import. The laptop shows a preview and skips anything it already has, so exporting twice is safe.</p>
    <button class="btn primary" id="export" style="width:100%">Export ${S.observations.length} prices and the list</button>
    <div id="exported" class="muted" style="margin-top:8px"></div>
    <div class="sec">This phone</div>
    <input class="device" id="device" value="${esc(S.device)}" aria-label="Device name">
    <p class="muted">Prices as of ${fmtDate(B.prices_as_of)}. Prices older than ${B.stale_days} days are marked stale.
      This file never connects to the internet: it has no address to connect to. Everything you note stays on this phone until you export it.</p>
    <button class="btn" id="clear-exported">Clear exported prices from this phone</button>
    <button class="btn danger" id="reset" style="margin-top:8px">Erase everything on this phone</button>
    <div id="confirm"></div>`;
}
$("#view-sync").addEventListener("click", (e) => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.id === "export") {
    const data = exportData(), name = exportName();
    const blob = new Blob([JSON.stringify(data, null, 1)], {type: "application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    S.exported = Array.from(new Set(S.exported.concat(S.observations.map((o) => o.uuid)))); save();
    window.__lastExport = data;
    renderSync(); $("#exported").textContent = `Saved ${name} (${S.observations.length} prices, ${data.list_changes.length} list changes).`;
  } else if (t.id === "clear-exported") {
    S.observations = S.observations.filter((o) => !S.exported.includes(o.uuid)); save(); renderSync(); toast("Cleared");
  } else if (t.id === "reset") {
    $("#confirm").innerHTML = `<div class="verdict bad" style="margin-top:8px">Erase all prices and list changes on this phone? Not-exported prices are lost.
      <div style="margin-top:8px"><button class="btn" id="reset-yes">Erase</button> <button class="btn" id="reset-no">Keep</button></div></div>`;
  } else if (t.id === "reset-yes") { localStorage.removeItem(KEY); S = load(); save(); renderAll(); toast("Erased"); }
  else if (t.id === "reset-no") { $("#confirm").innerHTML = ""; }
});
$("#view-sync").addEventListener("change", (e) => { if (e.target.id === "device") { S.device = e.target.value.trim() || "my phone"; save(); } });

// ---------- shell ----------
function show(v) {
  for (const x of ["check", "shop", "sync"]) $("#view-" + x).classList.toggle("hide", x !== v);
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.v === v));
  if (v === "shop") renderShop(); if (v === "sync") renderSync(); if (v === "check" && !cur) renderSearch();
}
$("#tabs").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) { if (cur && b.dataset.v !== "check") { cur = null; $("#check-product").classList.add("hide"); $("#check-search").classList.remove("hide"); } show(b.dataset.v); } });
const storeSel = $("#store");
storeSel.innerHTML = B.stores.map((s) => `<option ${s === S.store ? "selected" : ""}>${esc(s)}</option>`).join("");
storeSel.addEventListener("change", () => { S.store = storeSel.value; save(); renderAll(); });
function renderAll() {
  if (cur) renderProduct(); else renderSearch();
  if (!$("#view-shop").classList.contains("hide")) renderShop();
  if (!$("#view-sync").classList.contains("hide")) renderSync();
  $("#status").textContent = `Works offline · ${Object.keys(P).length} products · prices as of ${fmtDate(B.prices_as_of)}`;
}
save(); renderAll();
</script>
</body>
</html>
